# SeatGeek fork: build Ubuntu Focal–compatible Linux binaries for base-ami.
#
# base-ami is Ubuntu 20.04 (Focal). Binaries must be linked against Focal's
# glibc, so we compile inside docker.io/library/ubuntu:20.04 rather than on
# the host runner (Ubuntu 24.04).
#
# Publish target: GitHub Releases (not GCR/S3).
#   https://github.com/seatgeek/pgdog/releases/download/v<version>/pgdog-<version>-<amd64|arm64>
#
# That matches how base-ami already fetches coredns / CNI plugins. GCR/GHCR
# are container registries — pulling a bare binary would need oras/crane/docker
# plus registry auth in the Chef recipe. Prefer a Release asset + curl.
#
# Default version is 1.60-sg1 (upstream 0.1.60 + SeatGeek patch).
name: sg-release-binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact / release version (e.g. 1.60-sg1)
        required: true
        default: "1.60-sg1"
      publish_release:
        description: Create/update a GitHub Release and attach the binaries
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      VERSION: ${{ inputs.version }}
      ARTIFACT: pgdog-${{ inputs.version }}-${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6

      - name: Build inside Ubuntu Focal (glibc 2.31)
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CARGO_HOME=/usr/local/cargo \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH="/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -e TARGET \
            -e ARTIFACT \
            ubuntu:20.04 \
            bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git \
                build-essential cmake clang lld pkg-config libssl-dev \
                python3

              # .cargo/config.toml pins mold; Focal apt does not ship it.
              curl -fsSL -o /tmp/mold.tar.gz \
                "https://github.com/rui314/mold/releases/download/v2.34.1/mold-2.34.1-$(uname -m)-linux.tar.gz"
              tar -C /usr/local --strip-components=1 -xzf /tmp/mold.tar.gz
              ln -sf /usr/local/bin/mold /usr/bin/mold
              mold --version

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain 1.96 --profile minimal --target "$TARGET"
              . /usr/local/cargo/env
              rustc -V

              cargo build --release --target "$TARGET" -p pgdog

              cp "target/${TARGET}/release/pgdog" "dist/${ARTIFACT}"
              chmod 755 "dist/${ARTIFACT}"
              sha256sum "dist/${ARTIFACT}" | tee "dist/${ARTIFACT}.sha256"
              ldd "dist/${ARTIFACT}" || true
              "dist/${ARTIFACT}" --version || true
            '

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/${{ env.ARTIFACT }}
            dist/${{ env.ARTIFACT }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Download amd64 + arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pgdog-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist/

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "PgDog ${VERSION} (SeatGeek)" \
              --notes "SeatGeek build of PgDog ${VERSION} (Ubuntu Focal / glibc 2.31). For base-ami bootstrap."
          fi

          echo "Release assets:"
          echo "  https://github.com/${{ github.repository }}/releases/download/${TAG}/pgdog-${VERSION}-amd64"
          echo "  https://github.com/${{ github.repository }}/releases/download/${TAG}/pgdog-${VERSION}-arm64"
